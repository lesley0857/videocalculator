{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="workspace-card auth-card">
  <h1>Sign in</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Sign in</button></form>
  <p>New here? <a href="{% url 'accounts:register' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Create an account</a></p>
</section>
{% endblock %}
