{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="workspace-card auth-card">
  <h1>Create your account</h1>
  <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.GET.next }}">{{ form.as_p }}<button type="submit">Create account</button></form>
  <p>Already registered? <a href="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Sign in</a></p>
</section>
{% endblock %}
