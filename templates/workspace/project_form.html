{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="workspace-wrap"><div class="workspace-card"><h1>{{ heading }}</h1>
  <form method="post">{% csrf_token %}{% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}{{ form.as_p }}<button type="submit">Save project</button></form>
  {% if project %}<p><a href="{% url 'workspace:project-detail' project.pk %}">Cancel</a></p>{% endif %}
</div></section>
{% endblock %}
